# Configuration for the LastWeekIn.Tech pipeline.
#
# ${VAR} values are read from the environment at load time; an unset variable
# resolves to null, which disables the feature rather than sending a literal
# placeholder as a credential.

# RSS and Atom feeds to fetch. Hacker News is not listed here: its stories and
# their point totals come from the Algolia API (see the `hn` section below).
feeds:
  - name: "Ars Technica"
    url: "https://feeds.arstechnica.com/arstechnica/index"
  - name: "WIRED"
    url: "https://www.wired.com/feed/rss"
  - name: "The Register"
    url: "https://www.theregister.com/headlines.atom"
  - name: "TechCrunch"
    url: "http://feeds.feedburner.com/TechCrunch/"
  - name: "The Verge"
    url: "https://www.theverge.com/rss/index.xml"
  - name: "Slashdot"
    url: "http://rss.slashdot.org/Slashdot/slashdot"
  - name: "Techmeme"
    url: "https://www.techmeme.com/feed.xml"
    # Techmeme reports on coverage rather than producing it: its presence in a
    # cluster is corroboration, but the digest links to the original outlet.
    aggregator: true
  - name: "TechSpot"
    url: "https://www.techspot.com/backend.xml"
  - name: "BleepingComputer"
    url: "https://www.bleepingcomputer.com/feed/"
  - name: "The Hacker News"
    url: "https://feeds.feedburner.com/TheHackersNews"
  - name: "Android Police"
    url: "https://www.androidpolice.com/feed/"
  - name: "ExtremeTech"
    url: "https://www.extremetech.com/feed"
  - name: "Engadget"
    url: "https://www.engadget.com/rss.xml"
  - name: "MIT Technology Review"
    url: "https://www.technologyreview.com/feed/"

# Hacker News, via the Algolia search API.
hn:
  enabled: true
  # Stories below this many points are not fetched at all.
  min_points: 50
  # Traction above this adds nothing more, so one viral post cannot dominate.
  # Most front-page stories clear 500, so the cap sits higher to keep the top
  # tier distinguishable.
  points_cap: 1000
  # Maximum stories to pull for the week.
  limit: 200

# Editorial selection: one model call that reads the candidate pool with a
# rubric and picks the edition, with a one-line case per story and a short
# read on the week. Its picks still pass the mechanical guards (AI floor,
# source cap, body preference), and any failure falls back to the score
# ranking. One call a week justifies the strongest model in the chain.
editor:
  enabled: true
  model_name: "anthropic/claude-sonnet-5"
  fallback_models:
    - "anthropic/claude-haiku-4.5"
    - "google/gemini-3.7-flash"
  # Generous on purpose: reasoning models spend part of the budget thinking,
  # and a budget sized for the JSON alone truncated the first live verdict.
  max_tokens: 8000
  temperature: 0.2
  excerpt_chars: 300

# The consensus check: ask a Perplexity search model what the wider press led
# with this week, boost pool stories it corroborates (weights.consensus below)
# and record the headlines the funnel never saw. An unset key skips the stage.
perplexity:
  enabled: true
  api_key: "${PERPLEXITY_API_KEY}"
  model: "sonar-pro"
  story_count: 15

# Absolute origin of the published site, used for the feed, sitemap, canonical
# links and social cards.
site_url: "https://lastweekin.tech"

# How many days back to look.
window_days: 7

# Relative importance of each ranking signal. Every component is normalised to
# 0..1 before its weight applies, so these numbers compare directly: breadth of
# coverage is the strongest signal, recency only breaks ties.
weights:
  hn: 5
  src: 3
  rec: 1
  # Flat corroboration bonus for a story the Perplexity consensus also
  # carries; applied once per story, on top of the normalised components.
  consensus: 2

# The shape of a published edition.
digest:
  story_count: 7
  # A floor, not a quota: a week where every top story is about AI publishes
  # seven AI stories.
  min_ai_stories: 4
  # Refuse to publish when more than this many stories lack a usable summary.
  max_missing_summaries: 1
  # Only this many top-ranked stories have their article bodies downloaded.
  candidate_pool: 40
  # Do not republish a story that ran in an edition this recent. Ranking is
  # driven by Hacker News traction, which persists for days, so a story hot for
  # eight days would otherwise top two consecutive editions. The filter can
  # never shorten an edition: repeats come back if there is nothing else to
  # publish. Set to 0 to allow repeats.
  repeat_lookback_weeks: 3

# Summarization. Models are tried in order until one returns a usable answer.
#
# Seven summaries a week is roughly 4k input and 400 output tokens each, so the
# whole year costs a couple of dollars even on a paid tier. Free tiers bought
# nothing but rate limits and empty summaries, and their model IDs churn: the
# previous chain here listed four models, three of which OpenRouter had already
# retired. The fallbacks are deliberately spread across vendors so one
# provider's outage cannot empty an edition, with a free model last so a
# billing lapse still ships something.
summarizer:
  model_name: "anthropic/claude-haiku-4.5"
  fallback_models:
    - "google/gemini-3.7-flash"
    - "openai/gpt-5-mini"
    - "google/gemma-4-31b-it:free"
  hf_token: "${HF_TOKEN}"
  # Optional: models routed via Hugging Face instead of OpenRouter. Any model
  # listed here is skipped automatically when HF_TOKEN is unset.
  huggingface_models: []
  # Enough room for 2-4 complete sentences; 150 truncated most summaries
  # mid-word.
  max_tokens: 400
  max_input_chars: 12000
  temperature: 0.3

# The daily AI-only briefing: a second, independent pipeline. Same feeds and
# Hacker News signal as the weekly digest, but a 24-hour window, no
# mechanical category filter (a chip export-control story would be tagged
# Hardware or Policy, not AI, so relevance is judged by the briefing model
# itself against a broad candidate pool), and one model call that both
# selects the 4-5 stories and writes the analysis for each.
ai_daily:
  enabled: true
  window_days: 1
  candidate_pool: 30
  story_count: 5
  # A floor, not a quota: a thin news day publishes four, not a padded fifth.
  min_story_count: 4
  repeat_lookback_days: 3
  max_per_source: 2
  hn:
    # 24 hours of traction runs far lower than a week's worth.
    min_points: 20
    points_cap: 300
    limit: 200
  weights:
    hn: 5
    src: 3
    rec: 1
    # A 14-feed, 24-hour pool only recalls what those feeds happened to
    # publish in that window; on a day the best AI stories are niche items
    # no mainstream outlet picked up yet, the pool can end up entirely
    # Hacker-News-sourced. Reuses the same shared perplexity: settings the
    # weekly digest's consensus check uses, with its own AI-scoped prompt.
    consensus: 2
  briefing:
    model_name: "anthropic/claude-sonnet-5"
    fallback_models:
      - "anthropic/claude-haiku-4.5"
      - "google/gemini-3.7-flash"
    # Five stories' worth of analysis (three substantial text fields each) in
    # one JSON reply needs real headroom — a live run truncated at 6000
    # (finish_reason="length"), so this sits above editor's own 8000 budget
    # for a comparable but shorter one-shot JSON task.
    max_tokens: 12000
    temperature: 0.3
    excerpt_chars: 600
