[project]
name = "lastweekintech"
version = "0.1.0"
description = "Automation pipeline and assets for the LastWeekIn.Tech weekly news digest."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
  { name = "LastWeekIn.Tech Maintainers" }
]
dependencies = [
  "feedparser>=6.0",
  "pyyaml>=6.0.3",
  "requests>=2.32",
  "thefuzz[speedup]>=0.22.1",
  "openai>=3.0.0",
  "typer>=0.9",
  "jinja2>=3.1.6",
  "trafilatura>=2.2",
]

[dependency-groups]
# Installed by a plain `uv sync`, so `uv run ruff`/`mypy`/`pytest` work without
# remembering an extra flag.
dev = [
  "bandit>=1.7.9",
  "coverage>=7.6",
  "mypy>=2.3.0",
  "pre-commit>=4.0",
  "pytest>=9.1.1",
  "pytest-cov>=5.0",
  "ruff>=0.6.3",
  "types-PyYAML>=6.0",
  "types-requests>=2.32"
]

[project.scripts]
lastweekintech = "lastweekintech.main:app"

[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lastweekintech"]

[tool.hatch.build.targets.sdist]
include = ["src/lastweekintech", "README.md", "pyproject.toml", "docs"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Planning docs under docs/superpowers/ embed illustrative Python fences that
# are frozen snapshots, not shipped code — ruff format's preview markdown
# support reformats them anyway (and can change their meaning, e.g. turning
# kwargs into a tuple assignment), which these docs should never be checked
# against.
extend-exclude = ["docs/superpowers"]

[tool.ruff.format]
preview = true
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "S",
  "C4",
  "BLE",
  "RUF"
]
ignore = [
  "S101",
  # Lambdas read fine as small injected stubs and fake clients.
  "E731"
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E731"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/lastweekintech"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

# feedparser and thefuzz ship no type information. trafilatura is typed.
[[tool.mypy.overrides]]
module = ["feedparser", "thefuzz"]
ignore_missing_imports = true

[tool.codespell]
# Generated output carries real headline text from feeds we do not control, and
# regex stems in text.py ("vulnerabilit", "bount") are deliberate word fragments.
skip = "./archive,./index.html,./data,./uv.lock,./package-lock.json,./docs,./.git"
ignore-words-list = "vulnerabilit,bount,repositor"

[tool.bandit]
# Tests assert; the pipeline sleeps between polite requests.
skips = ["B101"]
exclude_dirs = ["tests", ".venv"]
