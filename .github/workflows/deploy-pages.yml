name: Deploy site to GitHub Pages

# public/ is generated output, committed by the weekly digest run (and by the
# manual fallback), so there is nothing to build here: every push to main that
# touches the site ships it as-is. The canonical URLs inside the pages point at
# https://lastweekin.tech, which is where the site is served from — the custom
# domain is configured on the repository, so no CNAME file is needed in the
# artifact. The *.github.io URL still resolves and redirects there.

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/deploy-pages.yml"
  # The weekly digest commits with the workflow's own GITHUB_TOKEN, and GitHub
  # deliberately never fires push workflows for such commits — so the Monday
  # publish would sit undeployed. Completion of that workflow is the trigger
  # that does fire.
  workflow_run:
    workflows: ["Weekly Tech Digest"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    # A digest run that failed or was gate-refused committed nothing; deploying
    # after it would only republish what is already live.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
