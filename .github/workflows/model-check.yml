name: Model availability

# Hosted model IDs get retired without notice, and the pipeline only finds out
# by producing an edition with no summaries. This runs the day before the
# digest so a dead model chain is a Sunday notification, not a Monday outage.
on:
  schedule:
    - cron: "0 9 * * 0" # Sundays, 09:00 UTC
  push:
    paths:
      - "src/lastweekintech/config.yaml"
      - "tools/check_models.py"
      # Watch itself: a change to this workflow should re-run it, or a fix to
      # the job never gets exercised until the next Sunday.
      - ".github/workflows/model-check.yml"
  workflow_dispatch:

permissions: {}

jobs:
  check-models:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      # checkout needs read access; on a private repo its absence surfaces as
      # "repository not found" rather than a permissions error.
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Check configured models against the OpenRouter catalogue
        id: check
        run: |
          set +e
          uv run python tools/check_models.py 2>&1 | tee "$RUNNER_TEMP/models.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            delimiter="LWIT_MODELS_$(openssl rand -hex 16)"
            {
              printf 'report<<%s\n' "$delimiter"
              cat "$RUNNER_TEMP/models.log"
              printf '\n%s\n' "$delimiter"
            } >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Open or update the model availability issue
        if: failure() && steps.check.outputs.report != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT: ${{ steps.check.outputs.report }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        with:
          script: |
            const LABEL = 'model-availability';
            const { owner, repo } = context.repo;
            const body = [
              'One or more summarization models in `config.yaml` are no longer offered.',
              'The pipeline will fall through to the remaining models; if none survive,',
              'the publish gate will reject the edition.',
              '',
              `**Run:** ${process.env.RUN_URL}`,
              '',
              '```',
              (process.env.REPORT || '').trim().slice(0, 5000),
              '```',
            ].join('\n');

            // Same de-duplication as the digest failure notifier: one open issue
            // per problem, a comment per occurrence.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: LABEL, per_page: 100,
            });
            const existing = open.find((issue) => !issue.pull_request);

            if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number, body,
              });
              return;
            }

            try {
              await github.rest.issues.createLabel({
                owner, repo, name: LABEL, color: 'd93f0b',
                description: 'A configured model is no longer available',
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

            await github.rest.issues.create({
              owner, repo, title: 'A configured summarization model is unavailable',
              labels: [LABEL], body,
            });
